name: Audit original Semrush ZIP SEO metadata
on:
  workflow_dispatch:
jobs:
  compare-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/verify-original-zip-seo.mjs
