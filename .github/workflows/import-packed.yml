name: Unpack complete Semrush migration source
on:
  push:
    paths:
      - '.migration/source.tar.br.b64'
permissions:
  contents: write
jobs:
  unpack-and-push:
    if: startsWith(github.event.head_commit.message, 'Stage full Semrush source archive')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Restore complete uploaded source bundle
        run: |
          test -s .migration/source.tar.br.b64
          node - <<'JS'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const b64 = fs.readFileSync('.migration/source.tar.br.b64','utf8').replace(/\s/g,'');
          const buffer = zlib.brotliDecompressSync(Buffer.from(b64, 'base64'));
          fs.writeFileSync('/tmp/semrush-source.tar', buffer);
          JS
          tar -xf /tmp/semrush-source.tar -C .
          test -f src/pages/index.astro
          test -f src/react/SiteApp.tsx
          test -f content/site.json
          test -f .pages.yml
          test -f scripts/verify.mjs
          test "$(find content/articles -maxdepth 1 -name '*.json' | wc -l)" -eq 35
      - name: Commit actual 138 source files to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .migration/
          git add -A
          git commit -m 'Import complete Semrush Astro and Pages CMS source files'
          git push origin HEAD:main
