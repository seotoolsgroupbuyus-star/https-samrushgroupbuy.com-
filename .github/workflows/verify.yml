name: Verify Semrush Astro migration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check full source upload
        run: |
          test -f src/pages/index.astro
          test -f src/react/SiteApp.tsx
          test -f .pages.yml
          test -f scripts/verify.mjs
      - run: npm install
      - run: npm run verify
      - run: npm run verify:cms
      - run: node scripts/test-cms-edit.mjs
      - run: node scripts/verify-design-parity.mjs
      - run: npm run build
      - run: node scripts/verify-meta-built.mjs
      - name: Verify Wrangler builds assets before deploying (no Cloudflare credentials needed)
        run: npx wrangler@4.168.0 deploy --dry-run
